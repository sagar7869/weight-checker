<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QC washer counter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding: 15px; font-family: Arial, sans-serif; color: #000; }
        .washer-card { background: #ffffff; border: 1px solid #ddd; border-radius: 10px; padding: 15px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .dashboard-box { background: #212529; color: white; border-radius: 8px; padding: 12px; text-align: center; }
        .weight-item { background: #f1f3f5; padding: 5px 10px; border-radius: 6px; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
    </style>
</head>
<body>

<div class="container" style="max-width: 800px;">
    <h2 class="text-center mb-4 fw-bold">QC washer counter</h2>

    <!-- Add Washer Card -->
    <div class="card p-3 mb-4 shadow-sm text-center">
        <div class="row g-2 align-items-center">
            <div class="col-md-8">
                <select id="newWasherSize" class="form-select">
                    <option value="">-- Washer Size / Name Chunein --</option>
                    <option value="HDG 45X28X4">HDG 45X28X4</option>
                    <option value="HDG 45X20X4">HDG 45X20X4</option>
                    <option value="HDG 74X68X4">HDG 74X68X4</option>
                    <option value="SS304 Plate Washer- 50X32X2 with 9mm hole">SS304 Plate Washer- 50X32X2 with 9mm hole</option>
                    <option value="SS304 Plate Washer- 50X16X2 with 9mm hole">SS304 Plate Washer- 50X16X2 with 9mm hole</option>
                    <option value="SS304 Plain Washer M10 OD">SS304 Plain Washer M10 OD</option>
                    <option value="SS304 Plain Washer M8 OD">SS304 Plain Washer M8 OD</option>
                    <option value="Zn Flake coated Plate Washer- 50X16X2 mm with 9mm hole">Zn Flake coated Plate Washer- 50X16X2 mm with 9mm hole</option>
                    <option value="Zn Flake coated Plate Washer- 50X32X2 mm with 9mm hole">Zn Flake coated Plate Washer- 50X32X2 mm with 9mm hole</option>
                    <option value="HDG 45X28X4- Vidya">HDG 45X28X4- Vidya</option>
                    <option value="HDG 45X20X4- Vidya">HDG 45X20X4- Vidya</option>
                    <option value="HDG 45X20X4- Parmar">HDG 45X20X4- Parmar</option>
                    <option value="HDG 45X28X4- Parmar">HDG 45X28X4- Parmar</option>
                    <option value="HDG 50X28X4- Parmar">HDG 50X28X4- Parmar</option>
                    <option value="HDG 74X68X4- Parmar">HDG 74X68X4- Parmar</option>
                </select>
            </div>
            <div class="col-md-4">
                <button onclick="addNewWasherCard()" class="btn btn-primary w-100 fw-bold">➕ Add Washer Card</button>
            </div>
        </div>
    </div>

    <!-- Cards Container -->
    <div id="cardsContainer"></div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzdb2G7RdCq_dGkFiZvGUvfdaOv-pJsdDQ_uMSx3yf1Y746etoyYG3HZhaG7uH5U3qgJw/exec";

    let washersData = JSON.parse(localStorage.getItem('qcWashersClean')) || [];

    function getTodayDate() {
        const today = new Date();
        const dd = String(today.getDate()).padStart(2, '0');
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const yyyy = today.getFullYear();
        return `${dd}-${mm}-${yyyy}`;
    }

    function addNewWasherCard() {
        const select = document.getElementById('newWasherSize');
        const sizeName = select.value;
        if (!sizeName) { alert("Pehle washer size chunein!"); return; }
        if (washersData.some(w => w.size === sizeName)) { alert("Yeh card pehle se added hai!"); return; }

        washersData.push({ size: sizeName, pcsPerKg: "", weights: [] });
        select.value = "";
        saveAndRender();
    }

    function updatePcs(index, val) {
        washersData[index].pcsPerKg = val;
        saveAndRenderLocally();
    }

    function addWeight(index) {
        const inputElem = document.getElementById(`weightInput_${index}`);
        const wVal = parseFloat(inputElem.value);
        const pcsVal = parseFloat(washersData[index].pcsPerKg);

        if (!wVal || wVal <= 0) { alert("Sahi weight dalein!"); return; }
        if (!pcsVal || pcsVal <= 0) { alert("Pehle 1 Kg me kitne pieces hain woh set karein!"); return; }

        const weightObj = { date: getTodayDate(), weight: wVal, pcsPerKg: pcsVal };
        washersData[index].weights.push(weightObj);
        inputElem.value = "";
        saveAndRender();

        syncToGoogleSheet(washersData[index].size, weightObj);
    }

    function deleteWeight(cardIndex, weightIndex) {
        if (confirm("Delete karna chahte hain?")) {
            washersData[cardIndex].weights.splice(weightIndex, 1);
            saveAndRender();
        }
    }

    function removeCard(index) {
        if (confirm("Card hatana chahte hain?")) {
            washersData.splice(index, 1);
            saveAndRender();
        }
    }

    function saveAndRenderLocally() {
        localStorage.setItem('qcWashersClean', JSON.stringify(washersData));
    }

    function saveAndRender() {
        saveAndRenderLocally();
        renderCards();
    }

    function syncToGoogleSheet(sizeName, weightObj) {
        if (WEB_APP_URL.includes("PASTE_KAREIN")) return;
        fetch(WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify({ date: weightObj.date, size: sizeName, weight: weightObj.weight, pcsPerKg: weightObj.pcsPerKg })
        }).catch(err => console.log("Sync error"));
    }

    function renderCards() {
        const container = document.getElementById('cardsContainer');
        container.innerHTML = "";

        if (washersData.length === 0) {
            container.innerHTML = `<p class="text-center text-muted">Koi washer card added nahi hai.</p>`;
            return;
        }

        washersData.forEach((card, cIndex) => {
            let totalW = 0;
            let pcs = parseFloat(card.pcsPerKg) || 0;

            card.weights.forEach(w => { totalW += w.weight; });
            let totalQ = totalW * pcs;

            let weightsHtml = "";
            card.weights.forEach((w, wIndex) => {
                weightsHtml += `<div class="weight-item">
                    <span><strong>${w.weight.toFixed(3)} Kg</strong></span>
                    <button class="btn btn-sm btn-light text-danger" onclick="deleteWeight(${cIndex}, ${wIndex})">🗑️</button>
                </div>`;
            });

            if (card.weights.length === 0) {
                weightsHtml = `<small class="text-muted">Abhi koi weight add nahi hua.</small>`;
            }

            let cardHtml = `<div class="washer-card">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold m-0 text-primary">▼ ${card.size}</h5>
                    <button class="btn btn-sm btn-outline-danger" onclick="removeCard(${cIndex})">Hatayein ❌</button>
                </div>
                
                <!-- DASHBOARD -->
                <div class="row g-2 mb-3">
                    <div class="col-md-5">
                        <div class="p-2 border rounded bg-light text-center">
                            <label class="form-label fw-bold text-secondary mb-1" style="font-size: 11px;">1 Kg me Pcs</label>
                            <input type="number" step="any" class="form-control form-control-sm text-center fw-bold" placeholder="jaise: 318" value="${card.pcsPerKg}" oninput="updatePcs(${cIndex}, this.value)">
                        </div>
                    </div>
                    <div class="col-md-7">
                        <div class="dashboard-box">
                            <div style="font-size: 11px;" class="text-warning">DASHBOARD SUMMARY</div>
                            <div style="font-size: 13px;">Weight: <strong>${totalW.toFixed(3)} kg</strong></div>
                            <div style="font-size: 13px;" class="text-success">Total Qty: <strong>${totalQ.toFixed(2)} pcs</strong></div>
                        </div>
                    </div>
                </div>

                <!-- WEIGHT INPUT -->
                <div class="row g-2 mb-3">
                    <div class="col-8">
                        <input type="number" step="0.001" id="weightInput_${cIndex}" class="form-control form-control-sm" placeholder="Weight (Kg) jaise: 45.120">
                    </div>
                    <div class="col-4">
                        <button onclick="addWeight(${cIndex})" class="btn btn-success btn-sm w-100 fw-bold">[+ Add]</button>
                    </div>
                </div>

                <div class="weight-list">${weightsHtml}</div>
            </div>`;

            container.innerHTML += cardHtml;
        });
    }

    renderCards();
</script>

</body>
</html>
